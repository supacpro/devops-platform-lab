name: DevOps Platform CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  hello-devops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "Welcome to DevOps Platform Lab"
          pwd
          ls -la

      - name: Show branch
        run: |
          echo "Current Branch:"
          git branch

      - name: Finish
        run: echo "Pipeline Success"